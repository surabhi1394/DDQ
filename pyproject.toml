[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddq-agent"
version = "0.1.0"
description = "ESG DDQ over-the-desk review agent: Offering Memorandum in, completed checklist out."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13",
    "pydantic>=2.6",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ddq = "ddq_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ddq_agent*"]

[tool.setuptools.package-data]
"ddq_agent.data" = ["*.json", "*.yaml"]
"ddq_agent.web" = ["*.html", "*.css"]
